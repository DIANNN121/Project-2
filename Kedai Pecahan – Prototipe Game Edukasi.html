<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kedai Pecahan – Prototipe</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF6E3;--card:#FFFFFF;--ink:#3A2418;--mut:#7B6252;--tom:#E5432D;--bas:#2E9E5B;--che:#FFC83D;--slice:#FCE7BE;--line:#EBD4A6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2B1D15;--card:#3B2A20;--ink:#FFF1DA;--mut:#CDB59C;--slice:#5A4231;--line:#5E4635;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2B1D15;--card:#3B2A20;--ink:#FFF1DA;--mut:#CDB59C;--slice:#5A4231;--line:#5E4635;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.5 Nunito,system-ui,sans-serif}
#app{max-width:720px;margin:0 auto;padding:12px 16px 40px}
h1,h2,.btn,.tile b{font-family:"Baloo 2",system-ui,sans-serif}
h1{font-size:44px;line-height:1.05;margin:6px 0;color:var(--tom)}
h2{font-size:24px;margin:22px 0 8px}
.mut{color:var(--mut)}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0 10px}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}
.c{text-align:center}
.logo{font-size:64px}
.btn{background:var(--tom);color:#fff;border:0;border-radius:14px;padding:10px 22px;font-size:19px;font-weight:800;cursor:pointer;min-height:46px}
.btn.g{background:var(--bas)}
.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:6px 14px;font:inherit;font-weight:700;cursor:pointer;min-height:40px}
.btn:focus-visible,.ghost:focus-visible,.tile:focus-visible,.sl:focus-visible,.mc:focus-visible,input:focus-visible{outline:3px solid var(--che);outline-offset:2px}
.btn:active{transform:translateY(2px)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:14px 0}
input[type=text]{font:inherit;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:min(100%,280px);margin:10px 0;text-align:center}
input[type=range]{width:100%;accent-color:var(--tom)}
.pico{display:flex;gap:10px;align-items:center;margin:8px 0}
.pi{font-size:46px;flex:none}
.bub{background:var(--che);color:#3A2418;border-radius:16px 16px 16px 4px;padding:10px 14px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 6px;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit}
.tile span{font-size:34px}.tile b{font-size:17px;line-height:1.15}.tile small{color:var(--mut);font-size:13px;line-height:1.2}.tile em{font-style:normal;font-size:15px;min-height:22px}
.tile.ok{border-color:var(--bas)}.tile.lock{opacity:.55}
.pz{width:min(250px,70vw);display:block;margin:6px auto}
.sl{fill:var(--slice);stroke:var(--ink);stroke-width:2;cursor:pointer;transition:fill .15s}
.sl.on{fill:var(--tom)}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-family:"Baloo 2",sans-serif;font-weight:800;line-height:1;margin:0 4px;font-size:1.15em}
.fr i{display:block;width:100%;height:3px;background:var(--ink);margin:2px 0;border-radius:2px}
.nu{color:var(--tom)}.de{color:var(--bas)}
.big .fr{font-size:2.2em}
.bar{display:flex;height:34px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;margin:4px 0 10px}
.bar span{flex:1;border-right:2px solid var(--ink);background:var(--slice)}.bar span:last-child{border-right:0}.bar span.f{background:var(--che)}
.bw{position:relative}.bw u{position:absolute;top:-4px;bottom:-4px;border-left:4px dashed var(--tom)}
.lab{font-weight:800;font-size:20px}
.good{color:var(--bas);font-weight:800}.bad{color:var(--tom);font-weight:800}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{min-height:92px;border-radius:14px;border:2px solid var(--line);background:var(--bas);color:#fff;font:800 30px "Baloo 2",sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px}
.mc.o{background:var(--card);color:var(--ink)}.mc.m{background:var(--card);border-color:var(--bas);color:var(--ink)}
.mc .bar{width:90%;height:14px;margin:4px 0 0}
.opt{display:block;width:100%;margin:8px 0;text-align:left}
.opt.w{background:#B33A28;opacity:.8}.opt.r{background:var(--bas)}
.stars{font-size:40px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
var A=document.getElementById('app');
var S={name:'',scr:'home',done:{},stars:{},demo:false,note:''};
var Z1={n:4,sel:new Set([0])},Z2={s:0,cmp:false},Z3={e:0,st:0},L1,L2,L3,R={},LAST={};
var g=function(a,b){return b?g(b,a%b):a};
var sim=function(m,d){var x=g(m,d);return [m/x,d/x]};
var rnd=function(n){return Math.floor(Math.random()*n)};
var shuf=function(a){return a.map(function(x){return [Math.random(),x]}).sort(function(p,q){return p[0]-q[0]}).map(function(p){return p[1]})};
var fr=function(a,b){return '<span class="fr"><b class="nu">'+a+'</b><i></i><b class="de">'+b+'</b></span>'};
var eq=function(n){return Array(n).fill(360/n)};
var bar=function(n,k){var s='';for(var i=0;i<n;i++)s+='<span class="'+(i<k?'f':'')+'"></span>';return '<div class="bar">'+s+'</div>'};
var pico=function(t){return '<div class="pico"><div class="pi" aria-hidden="true">🍕</div><div class="bub">'+t+'</div></div>'};
function pizza(ang,sel,click){
  var c=110,r=100,t=0,o='';
  var pt=function(a){var x=(a-90)*Math.PI/180;return [(c+r*Math.cos(x)).toFixed(1),(c+r*Math.sin(x)).toFixed(1)]};
  ang.forEach(function(w,i){
    var p=pt(t),q=pt(t+w);t+=w;
    o+='<path tabindex="'+(click?0:-1)+'" role="'+(click?'button':'img')+'" aria-label="potongan '+(i+1)+'" class="sl'+(sel.has(i)?' on':'')+'" d="M'+c+' '+c+'L'+p[0]+' '+p[1]+'A'+r+' '+r+' 0 '+(w>180?1:0)+' 1 '+q[0]+' '+q[1]+'Z"'+(click?' onclick="'+click+'('+i+')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){'+click+'('+i+')}"':'')+'/>';
  });
  return '<svg viewBox="0 0 220 220" class="pz">'+o+'</svg>';
}
function go(s){S.scr=s;S.note='';render();window.scrollTo(0,0)}
function stars(){return Object.keys(S.stars).reduce(function(a,k){return a+S.stars[k]},0)}
function hd(){return '<header><b>🍕 Kedai Pecahan</b>'+(S.scr!=='map'?'<button class="ghost" onclick="go(\'map\')">← Peta</button>':'')+'<span>⭐ '+stars()+'</span></header>'}
function render(){var f={home:home,map:map,z1:z1,z2:z2,z3:z3,l1:l1,l2:l2,l3:l3,fin:fin,res:res}[S.scr];A.innerHTML=(S.scr==='home'?'':hd())+f()}
function finish(l,st,msg){S.stars[l]=Math.max(S.stars[l]||0,st);LAST={l:l,st:st,msg:msg};go('fin')}

/* HOME + PETA */
function home(){return '<div class="card c"><div class="logo">🍕</div><h1>Kedai Pecahan</h1><p class="mut">Belajar pecahan sambil jadi koki cilik. Prototipe untuk Matematika Kelas V.</p>'+pico('Halo, Koki Cilik! Yuk bantu aku melayani pelanggan di Kedai Pecahan!')+'<input type="text" id="nm" maxlength="16" placeholder="Siapa namamu?" value="'+S.name+'" aria-label="Nama"><br><button class="btn" onclick="S.name=document.getElementById(\'nm\').value.trim()||\'Koki Cilik\';go(\'map\')">Mulai</button></div>'}
function map(){
  var un=S.demo||[1,2,3].every(function(z){return S.done[z]});
  var zc=function(z,t,d){return '<button class="tile'+(S.done[z]?' ok':'')+'" onclick="go(\'z'+z+'\')"><span>'+(S.done[z]?'✅':['','🍕','📏','➕'][z])+'</span><b>'+t+'</b><small>'+d+'</small></button>'};
  var lc=function(l,t,d){return '<button class="tile'+(un?'':' lock')+'" onclick="'+(un?'go(\'l'+l+'\')':'S.note=\'Selesaikan 3 zona belajar dulu, ya!\';render()')+'"><span>'+(un?['','🧾','🃏','📖'][l]:'🔒')+'</span><b>'+t+'</b><small>'+d+'</small><em>'+('⭐'.repeat(S.stars[l]||0)||'&nbsp;')+'</em></button>'};
  return pico('Halo, '+S.name+'! Selesaikan tiga Zona Belajar untuk membuka oven game.')+(S.note?'<p class="bad">'+S.note+'</p>':'')+
  '<h2>Zona Belajar</h2><div class="grid">'+zc(1,'Apa itu pecahan?','Pembilang dan penyebut')+zc(2,'Pecahan senilai','Beda bentuk, nilai sama')+zc(3,'Menjumlah','Samakan penyebut')+'</div>'+
  '<h2>Level Game</h2><div class="grid">'+lc(1,'Pesanan Kilat','Tunjukkan pecahan')+lc(2,'Pasangan Senilai','Cocokkan kartu')+lc(3,'Resep Ajaib','Soal cerita')+'</div>'+
  '<div class="row"><button class="ghost" onclick="S.demo=!S.demo;render()">'+(S.demo?'Matikan':'Aktifkan')+' mode demo (buka semua level)</button><button class="btn g" onclick="go(\'res\')">Lihat hasil</button></div>'}

/* ZONA 1 */
function z1box(){return pizza(eq(Z1.n),Z1.sel,'z1t')+'<div class="c big">'+fr(Z1.sel.size,Z1.n)+'</div><p class="c">Kamu mengambil <b class="nu">'+Z1.sel.size+'</b> dari <b class="de">'+Z1.n+'</b> potong yang sama besar.</p>'}
function z1n(v){Z1.n=+v;Z1.sel=new Set([...Z1.sel].filter(function(i){return i<Z1.n}));document.getElementById('z1b').innerHTML=z1box()}
function z1t(i){Z1.sel.has(i)?Z1.sel.delete(i):Z1.sel.add(i);document.getElementById('z1b').innerHTML=z1box()}
function z1(){return pico('Penyebut = jumlah seluruh potongan yang sama besar. Pembilang = potongan yang diambil.')+'<div class="card"><label>Geser untuk mengubah jumlah potongan: <b id="zn"></b></label><input type="range" min="2" max="8" value="'+Z1.n+'" oninput="z1n(this.value)" aria-label="Jumlah potongan"><p class="mut">Ketuk potongan pizza untuk mengambilnya.</p><div id="z1b">'+z1box()+'</div></div><div class="card"><b class="bad">✗ Bukan pecahan</b>'+pizza([200,100,60],new Set([0]),null)+'<p class="c">Potongannya tidak sama besar, jadi tidak bisa disebut pecahan.</p></div><div class="row"><button class="btn g" onclick="S.done[1]=true;go(\'map\')">Selesai zona ini</button></div>'}

/* ZONA 2 */
var SETS=[[[1,2],[2,4],[4,8]],[[1,3],[2,6],[3,9]]];
function z2(){var st=SETS[Z2.s],pos=st[0][0]/st[0][1]*100;
  return pico('Lihat batang-batang ini! Bentuknya beda, tapi apakah nilainya sama?')+'<div class="card"><div class="row" style="margin-top:0"><button class="ghost" onclick="Z2.s=0;Z2.cmp=false;render()">Set 1/2</button><button class="ghost" onclick="Z2.s=1;Z2.cmp=false;render()">Set 1/3</button></div><div class="bw">'+st.map(function(p){return '<div class="lab">'+fr(p[0],p[1])+'</div>'+bar(p[1],p[0])}).join('')+(Z2.cmp?'<u style="left:calc('+pos+'% + 0px)"></u>':'')+'</div><div class="row"><button class="btn" onclick="Z2.cmp=!Z2.cmp;render()">'+(Z2.cmp?'Sembunyikan garis':'Bandingkan')+'</button></div>'+(Z2.cmp?'<p class="good c">Semua batang berakhir di garis yang sama, jadi '+st.map(function(p){return p[0]+'/'+p[1]}).join(' = ')+'.</p>':'')+'</div><div class="row"><button class="btn g" onclick="S.done[2]=true;go(\'map\')">Selesai zona ini</button></div>'}

/* ZONA 3 */
var E=[[1,2,1,4],[1,3,1,6]];
function z3(){var a=E[Z3.e][0],b=E[Z3.e][1],c=E[Z3.e][2],d=E[Z3.e][3],m=a*d/b,s=sim(m+c,d),t=Z3.st,x='';
  if(t===0)x='<div class="lab">'+fr(a,b)+'</div>'+bar(b,a)+'<div class="lab">'+fr(c,d)+'</div>'+bar(d,c)+'<p>Potongannya beda ukuran, jadi belum bisa langsung digabung.</p>';
  else if(t===1)x='<div class="lab">'+fr(a,b)+' = '+fr(m,d)+'</div>'+bar(d,m)+'<div class="lab">'+fr(c,d)+'</div>'+bar(d,c)+'<p>Samakan ukuran potongan (penyebut sama). Nilainya tidak berubah.</p>';
  else if(t===2)x='<div class="lab">'+fr(m,d)+' + '+fr(c,d)+' = '+fr(m+c,d)+(s[1]!==d?' = '+fr(s[0],s[1]):'')+'</div>'+bar(d,m+c)+'<p>Potongannya sudah sama besar, tinggal jumlahkan pembilangnya.</p>';
  else x='<p>Mengapa bukan '+fr(a+c,b+d)+'? Karena '+(a+c)+'/'+(b+d)+' lebih kecil dari '+a+'/'+b+', padahal kita sedang menambah. <b class="bad">Penyebut tidak ikut dijumlahkan!</b></p>';
  return pico('Yuk jumlahkan '+a+'/'+b+' + '+c+'/'+d+' langkah demi langkah.')+'<div class="card"><div class="row" style="margin-top:0"><button class="ghost" onclick="Z3={e:0,st:0};render()">1/2 + 1/4</button><button class="ghost" onclick="Z3={e:1,st:0};render()">1/3 + 1/6</button></div>'+x+'<div class="row">'+(t<3?'<button class="btn" onclick="Z3.st++;render()">Langkah berikutnya</button>':'<button class="btn g" onclick="S.done[3]=true;go(\'map\')">Selesai zona ini</button>')+(t>0?'<button class="ghost" onclick="Z3.st=0;render()">Ulangi</button>':'')+'</div></div>'}

/* LEVEL 1 */
function newOrder(){var n=[4,6,8][rnd(3)];return {n:n,k:1+rnd(n-1),sel:new Set(),fb:'',done:false}}
function l1(){if(!L1)L1=Object.assign({i:0,ok:0},newOrder());
  var o=L1;
  return pico('Pesanan '+(o.i+1)+' dari 5. Layani dengan tepat!')+'<div class="card c"><div class="big">Aku mau '+fr(o.k,o.n)+' pizza!</div>'+pizza(eq(o.n),o.sel,'l1t')+(o.fb?'<p>'+o.fb+'</p>':'<p class="mut">Ketuk potongan sesuai pesanan.</p>')+'<div class="row">'+(o.done?'<button class="btn" onclick="l1n()">Lanjut</button>':'<button class="btn" onclick="l1c()">Layani</button>')+'</div></div>'}
function l1t(i){if(L1.done)return;L1.sel.has(i)?L1.sel.delete(i):L1.sel.add(i);render()}
function l1c(){var o=L1;if(!o.sel.size){o.fb='<span class="bad">Pilih dulu potongannya.</span>';return render()}
  if(o.sel.size===o.k){o.ok++;o.fb='<span class="good">Pas! Pelanggan senang. +10 poin 🎉</span>'}else o.fb='<span class="bad">Kamu mengambil '+o.sel.size+' potong, padahal pesanannya '+o.k+' dari '+o.n+' potong.</span>';
  o.done=true;render()}
function l1n(){var ok=L1.ok,i=L1.i+1;if(i>=5){L1=null;finish(1,ok>=4?3:ok>=3?2:1,'Kamu melayani '+ok+' dari 5 pesanan dengan benar.')}else{L1=Object.assign({i:i,ok:ok},newOrder());render()}}

/* LEVEL 2 */
var PR=[[[1,2],[2,4]],[[1,3],[2,6]],[[3,4],[6,8]],[[1,4],[2,8]]];
function l2init(){var c=[];PR.forEach(function(p,i){c.push({p:i,v:p[0],b:0});c.push({p:i,v:p[1],b:1})});L2={c:shuf(c),f:[],m:new Set(),mv:0,lock:false}}
function l2(){if(!L2)l2init();
  var h=L2.c.map(function(k,i){var open=L2.f.indexOf(i)>-1||L2.m.has(k.p);
    return '<button class="mc'+(L2.m.has(k.p)?' m':open?' o':'')+'" onclick="l2f('+i+')" aria-label="kartu '+(i+1)+'">'+(open?fr(k.v[0],k.v[1])+(k.b?bar(k.v[1],k.v[0]):''):'?')+'</button>'}).join('');
  return pico('Temukan dua kartu yang nilainya sama. Langkah: '+L2.mv)+'<div class="mg">'+h+'</div>'}
function l2f(i){if(L2.lock||L2.f.indexOf(i)>-1||L2.m.has(L2.c[i].p))return;L2.f.push(i);render();
  if(L2.f.length===2){L2.mv++;var a=L2.c[L2.f[0]],b=L2.c[L2.f[1]];L2.lock=true;
    setTimeout(function(){if(a.p===b.p)L2.m.add(a.p);L2.f=[];L2.lock=false;
      if(L2.m.size===PR.length){var mv=L2.mv;L2=null;finish(2,mv<=7?3:mv<=11?2:1,'Semua pasangan ketemu dalam '+mv+' langkah.')}else render()},800)}}

/* LEVEL 3 */
var QS=[[1,3,1,6],[1,2,1,4],[2,5,1,10]];
function l3(){if(!L3)L3={i:0,ok:0,miss:false,hint:false,done:false,pick:-1,opts:null};
  var q=QS[L3.i],a=q[0],b=q[1],c=q[2],d=q[3],m=a*d/b+c,s=sim(m,d),ans=s[0]+'/'+s[1];
  if(!L3.opts)L3.opts=shuf([ans,(a+c)+'/'+(b+d),(a+c)+'/'+d]);
  var o=L3.opts.map(function(t,j){var cls=L3.pick===j?(t===ans?' r':' w'):(L3.done&&t===ans?' r':'');return '<button class="btn opt'+cls+'" onclick="l3p('+j+')">'+t+' cangkir</button>'}).join('');
  return pico('Resep '+(L3.i+1)+' dari 3. Baca resepnya dengan teliti!')+'<div class="card"><p>📖 Kue ini butuh <b>'+a+'/'+b+'</b> cangkir gula, lalu ditambah <b>'+c+'/'+d+'</b> cangkir gula. Berapa cangkir gula semuanya?</p>'+(L3.hint?'<p class="mut">Petunjuk: samakan penyebutnya dulu. '+a+'/'+b+' = '+(a*d/b)+'/'+d+'.</p>':'<button class="ghost" onclick="L3.hint=true;render()">Minta petunjuk</button>')+o+(L3.pick>-1?'<p>'+(L3.opts[L3.pick]===ans?'<span class="good">Benar! '+(a*d/b)+'/'+d+' + '+c+'/'+d+' = '+m+'/'+d+(s[1]!==d?' = '+ans:'')+'.</span>':'<span class="bad">Belum tepat. Ingat, penyebut tidak ikut dijumlahkan. Coba lagi!</span>')+'</p>':'')+(L3.done?'<div class="row"><button class="btn g" onclick="l3n()">Lanjut</button></div>':'')+'</div>'}
function l3p(j){if(L3.done)return;L3.pick=j;var q=QS[L3.i],s=sim(q[0]*q[3]/q[1]+q[2],q[3]);if(L3.opts[j]===s[0]+'/'+s[1]){L3.done=true;if(!L3.miss)L3.ok++}else L3.miss=true;render()}
function l3n(){var ok=L3.ok,i=L3.i+1;if(i>=3){L3=null;finish(3,ok>=3?3:ok>=2?2:1,'Kamu benar pada percobaan pertama di '+ok+' dari 3 resep.')}else{L3={i:i,ok:ok,miss:false,hint:false,done:false,pick:-1,opts:null};render()}}

/* HASIL */
function fin(){return '<div class="card c"><h2>Level '+LAST.l+' selesai!</h2><div class="stars" aria-label="'+LAST.st+' bintang">'+'⭐'.repeat(LAST.st)+'</div><p>'+LAST.msg+'</p><div class="row"><button class="btn" onclick="go(\'map\')">Kembali ke peta</button></div></div>'}
function res(){var t=stars();
  return '<div class="card c"><h2>Hasil '+S.name+'</h2><div class="stars">⭐ '+t+' / 9</div><p>'+(t>=7?'🏅 Lencana <b>Koki Pecahan</b> kamu dapatkan!':'Kumpulkan 7 bintang untuk lencana Koki Pecahan.')+'</p><p class="mut">Zona selesai: '+Object.keys(S.done).length+' dari 3 · Pesanan Kilat '+(S.stars[1]||0)+' · Pasangan Senilai '+(S.stars[2]||0)+' · Resep Ajaib '+(S.stars[3]||0)+'</p></div>'+
